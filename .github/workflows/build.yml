name: Build Windows EXE

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install packages
      run: |
        pip install -r requirements.txt
        pip install pyinstaller


    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole office_agent.py


    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: office-agent
        path: dist/office_agent.exe
